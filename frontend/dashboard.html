<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgriConnect Sénégal — Tableau de bord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="header-simple">
    <div class="header-container">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
            <circle cx="20" cy="20" r="18" stroke="#7AB648" stroke-width="1.5"/>
            <path d="M20 29 C20 29 10 23 10 15 C10 10 15 7 20 11 C25 7 30 10 30 15 C30 23 20 29 20 29Z" fill="#7AB648" opacity="0.9"/>
            <circle cx="20" cy="11" r="2" fill="#F5E6C8"/>
          </svg>
        </div>
        <h1>Agri<span>Connect</span></h1>
      </div>
      
      <div class="header-actions">
        <button class="btn-catalogue" id="catalogueBtn">Catalogue</button>
        <button class="btn-logout" id="logoutBtn">Déconnexion</button>
      </div>
    </div>
  </header>

  <div class="dashboard-container">
    
    <div class="profile-card">
      <div class="profile-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="profile-info">
        <h3 id="profileName">Chargement...</h3>
        <p id="profileRole">Chargement...</p>
        <p id="profileLocation">Chargement...</p>
      </div>
    </div>

    <div class="dashboard-tabs">
      <button class="tab-dash active" data-tab="orders">Commandes</button>
      <button class="tab-dash" data-tab="products" id="farmerTab">Mes produits</button>
      <button class="tab-dash" data-tab="profile">Mon profil</button>
    </div>

    <div class="dashboard-content">
      
      <!-- Onglet Commandes -->
      <div class="tab-pane active" id="ordersPane">
        <div class="section-header">
          <h3>Historique des commandes</h3>
        </div>
        <div class="orders-list" id="ordersList">
          <div class="loading-small">
            <div class="spinner-small"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
      
      <!-- Onglet Mes produits -->
      <div class="tab-pane" id="productsPane">
        <div class="section-header">
          <h3>Mes produits</h3>
          <button class="btn-add" id="showAddProductBtn">Ajouter un produit</button>
        </div>
        
        <div class="products-list" id="productsList">
          <div class="loading-small">
            <div class="spinner-small"></div>
            <p>Chargement...</p>
          </div>
        </div>
      </div>
      
      <!-- Onglet Mon profil -->
      <div class="tab-pane" id="profilePane">
        <div class="section-header">
          <h3>Mes informations personnelles</h3>
          <button class="btn-edit-profile" id="editProfileBtn">✏️ Modifier</button>
        </div>
        
        <div id="profileView">
          <div class="profile-detail">
            <div class="detail-row">
              <span class="detail-label">Nom complet :</span>
              <span class="detail-value" id="profileFullName">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Téléphone :</span>
              <span class="detail-value" id="profilePhone">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Rôle :</span>
              <span class="detail-value" id="profileRoleDisplay">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Localisation :</span>
              <span class="detail-value" id="profileLocationDisplay">-</span>
            </div>
          </div>
        </div>
        
        <div id="profileForm" style="display: none;">
          <div class="form-group">
            <label>Nom complet</label>
            <input type="text" id="editFullName" class="form-input">
          </div>
          <div class="form-group">
            <label>Téléphone</label>
            <div class="input-wrap phone-wrap">
              <span class="phone-prefix">+221</span>
              <input type="tel" id="editPhone" placeholder="77 000 00 00" class="form-input">
            </div>
            <small>Format: 77 123 45 67</small>
          </div>
          <div class="form-group">
            <label>Localisation (région)</label>
            <select id="editLocation" class="form-input">
              <option value="Dakar">Dakar</option>
              <option value="Thiès">Thiès</option>
              <option value="Saint-Louis">Saint-Louis</option>
              <option value="Diourbel">Diourbel</option>
              <option value="Fatick">Fatick</option>
              <option value="Kaffrine">Kaffrine</option>
              <option value="Kaolack">Kaolack</option>
              <option value="Kédougou">Kédougou</option>
              <option value="Kolda">Kolda</option>
              <option value="Louga">Louga</option>
              <option value="Matam">Matam</option>
              <option value="Sédhiou">Sédhiou</option>
              <option value="Tambacounda">Tambacounda</option>
              <option value="Ziguinchor">Ziguinchor</option>
            </select>
          </div>
          
          <div class="form-divider">
            <span>Changer de mot de passe (optionnel)</span>
          </div>
          
          <div class="form-group">
            <label>Mot de passe actuel</label>
            <input type="password" id="editCurrentPassword" class="form-input" placeholder="Requis pour modifier">
          </div>
          <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" id="editNewPassword" class="form-input" placeholder="Minimum 6 caractères">
          </div>
          <div class="form-group">
            <label>Confirmer le nouveau mot de passe</label>
            <input type="password" id="editConfirmPassword" class="form-input" placeholder="">
          </div>
          
          <div class="form-actions">
            <button class="btn-cancel" id="cancelProfileEdit">Annuler</button>
            <button class="btn-save" id="saveProfileBtn">Enregistrer</button>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Modal Ajout Produit -->
  <div id="addProductModal" class="product-modal" style="display: none;">
    <div class="product-modal-content">
      <div class="product-modal-header">
        <h3>Ajouter un produit</h3>
        <button class="product-modal-close" id="closeAddModal">&times;</button>
      </div>
      <div class="product-modal-body">
        <div class="form-group">
          <label>Nom du produit</label>
          <input type="text" id="modalProductName" class="form-input" placeholder="Ex: Oignons de Thiès">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Prix (FCFA)</label>
            <input type="number" id="modalProductPrice" class="form-input" placeholder="500">
          </div>
          <div class="form-group">
            <label>Unité</label>
            <select id="modalProductUnit" class="form-input">
              <option value="kg">Kilogramme (kg)</option>
              <option value="litre">Litre (L)</option>
              <option value="botte">Botte</option>
              <option value="piece">Pièce</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantité</label>
            <input type="number" id="modalProductQuantity" class="form-input" placeholder="100">
          </div>
        </div>
        <div class="form-group">
          <label>Catégorie</label>
          <select id="modalProductCategory" class="form-input">
            <option value="1">Légumes</option>
            <option value="2">Fruits</option>
            <option value="3">Céréales</option>
            <option value="4">Tubercules</option>
            <option value="5">Volaille</option>
            <option value="6">Produits laitiers</option>
            <option value="7">Poissons</option>
            <option value="8">Autres</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="modalProductDescription" rows="3" class="form-input" placeholder="Description du produit..."></textarea>
        </div>
        <div class="form-group">
          <label>Régions de disponibilité</label>
          <div id="modalRegionsGroup" class="regions-grid">
            <label><input type="checkbox" value="Dakar"> Dakar</label>
            <label><input type="checkbox" value="Thiès"> Thiès</label>
            <label><input type="checkbox" value="Saint-Louis"> Saint-Louis</label>
            <label><input type="checkbox" value="Diourbel"> Diourbel</label>
            <label><input type="checkbox" value="Fatick"> Fatick</label>
            <label><input type="checkbox" value="Kaffrine"> Kaffrine</label>
            <label><input type="checkbox" value="Kaolack"> Kaolack</label>
            <label><input type="checkbox" value="Kédougou"> Kédougou</label>
            <label><input type="checkbox" value="Kolda"> Kolda</label>
            <label><input type="checkbox" value="Louga"> Louga</label>
            <label><input type="checkbox" value="Matam"> Matam</label>
            <label><input type="checkbox" value="Sédhiou"> Sédhiou</label>
            <label><input type="checkbox" value="Tambacounda"> Tambacounda</label>
            <label><input type="checkbox" value="Ziguinchor"> Ziguinchor</label>
          </div>
        </div>
        <div class="form-group">
          <label>Image du produit</label>
          <input type="file" id="modalProductImage" accept="image/*" class="form-input">
          <div id="modalImagePreview" style="margin-top: 10px;"></div>
        </div>
      </div>
      <div class="product-modal-footer">
        <button class="btn-cancel" id="cancelAddModal">Annuler</button>
        <button class="btn-save" id="saveProductModal">Ajouter</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
